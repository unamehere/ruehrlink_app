name: ruehrlink
description: "Rührlink – die App zur Rührlink. Strikt lokal im Heim-WLAN."
publish_to: 'none'

# Eigene Versionsnummer der App, unabhängig von der Firmware (Kompatibilität über api/features,
# siehe ruehrlink_esp/docs/api.md). Zusammen mit lib/version.dart hochzählen.
version: 0.5.1+28

environment:
  sdk: ^3.14.0

# Jede Abhängigkeit ist in docs/architektur.md begründet.
# Regel: keine Pakete mit Analytics, Firebase, Crash-Reporting, Werbung oder Netzwerkzugriff nach außen.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  intl: ^0.20.2
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  bonsoir: ^7.1.6
  universal_ble: ^3.3.0
  pointycastle: ^4.0.0
  device_info_plus: ^13.3.0
  flutter_zxing: ^3.1.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  flutter_svg: ^2.4.0
  archive: ^4.0.0
  crypto: ^3.0.6
  file_selector: ^1.0.3
  url_launcher: ^6.3.1
  # System-Teilen-Menü für Rezept-Dateien (.rlrezept) und „Problem melden“ (kein eigener Netzwerkzugriff)
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Platzhalter-Illustrationen (Fluent Emoji 3D, MIT) – siehe docs/illustrationen.md
    - assets/illustrations/
    - assets/brand/
    # Bildanleitung „Maschine koppeln“ (eigene Fotos, verkleinert auf 1000 px)
    - assets/anleitung/maschine-koppeln/
    # Grundrezepte als Rezept-Dateien (.rlrezept) für „Grundrezepte hinzufügen“ – Entwürfe, an der Maschine prüfen
    - assets/rezepte/
    # Eingebaute Firmware des Rührlink als Update-Datei .rlfw, von ruehrlink_esp/tools/firmware_sign.py pack
    # erzeugt (nicht im Repo)
    - assets/firmware/
