# Prüf-Pipeline: analyze + Tests bei jedem Push und Pull Request (ohne Geheimnisse).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: App und eingebaute Firmware – gleiche Mittelzahl (0.6.x ↔ 0.6.y)
        run: |
          APP="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          FW="$(tr -d '[:space:]' < FIRMWARE_VERSION)"
          if [ "${APP%.*}" != "${FW%.*}" ]; then
            echo "App $APP und Firmware $FW passen nicht: MAJOR.MINOR muss gleich sein"; exit 1
          fi
      - name: Eingebaute Firmware holen (FIRMWARE_VERSION, aus ruehrlink_esp)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FW="$(tr -d '[:space:]' < FIRMWARE_VERSION)"
          gh release download "fw-v$FW" -R unamehere/ruehrlink_esp -p "ruehrlink-$FW.rlfw" -D assets/firmware
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
